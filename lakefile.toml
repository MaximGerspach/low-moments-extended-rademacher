name = "RMF"
defaultTargets = ["RMF"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
linter.mathlibStandardSet = true
linter.style.longFile = 2500
linter.style.longFileDefValue = 2500

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "7715064f690d0689f30889846f4e2c5e7ec0c47e"

# `lake build` builds the library (`RMF.lean`), the paper's results (`RMF/Paper.lean`,
# `RMF/PaperExplicit.lean`) and prints their axioms (`RMF/PaperAxioms.lean`).  The glob `RMF` is
# what makes every `RMF.*` module part of the library.
[[lean_lib]]
name = "RMF"
globs = ["RMF", "RMF.Paper", "RMF.PaperAxioms"]
